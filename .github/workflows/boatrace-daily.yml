# ペーパートレード (お金を賭けない記録テスト) を1日1回行う。
# 前日 (日本時間) のレースのうち 2場分の締切時オッズを取り、固定ルールの買い目と結果を
# boatrace-data ブランチの papertrade/ に記録する。
# - schedule は既定ブランチ (main) にこのファイルがあるときだけ動く
# - 手動で動かすときは boatrace/daily_range.txt に "開始日 終了日" を書いてプッシュする
name: boatrace-daily

on:
  schedule:
    - cron: "7 1 * * *"  # 毎日 10:07 (日本時間)
  push:
    branches: [boatrace-app]
    paths: [boatrace/daily_range.txt]

permissions:
  contents: write

concurrency: boatrace-data

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boatrace-app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: boatrace-data を取得
        run: git clone -q --branch boatrace-data --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" boatrace/data
      - name: 対象日を決める
        working-directory: boatrace
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            read START END < daily_range.txt
          else
            START=$(TZ=Asia/Tokyo date -d yesterday +%F); END=$START
          fi
          LAST=$(ls data/raw | grep '^k' | sort | tail -1 | sed 's/k\(..\)\(..\)\(..\).lzh/20\1-\2-\3/')
          echo "START=$START" >> "$GITHUB_ENV"; echo "END=$END" >> "$GITHUB_ENV"
          echo "FROM=$(date -d "$LAST + 1 day" +%F)" >> "$GITHUB_ENV"
          echo "MONTH=$(date -d "$START" +%Y%m)" >> "$GITHUB_ENV"
      - name: 番組表・成績の取得 (前回からの不足分)
        working-directory: boatrace
        run: |
          pip install -q -r requirements.txt
          python -m boatrace.cli fetch "$FROM" "$END"
          python -m boatrace.cli --db /tmp/bt.sqlite load 2025-10-01 "$END" --offline > /dev/null
      - name: 締切時オッズの取得 (1日2場)
        working-directory: boatrace
        timeout-minutes: 30
        continue-on-error: true
        run: |
          for BET in 単勝 2連単; do
            python -m boatrace.cli --db /tmp/bt.sqlite fetch-odds "$START" "$END" --bet-type "$BET" \
              --max-venues 2 --csv "data/odds/paper_${BET}_${MONTH}.csv"
          done
      - name: 記録
        working-directory: boatrace
        run: |
          mkdir -p data/papertrade
          python -m boatrace.cli --db /tmp/bt.sqlite load-odds data/odds/paper_*.csv > /dev/null
          python -m boatrace.cli --db /tmp/bt.sqlite papertrade "$START" "$END" \
            --model data/model/model.txt --csv data/papertrade/picks.csv | tee data/papertrade/report.txt
      - name: 保存
        if: always()
        working-directory: boatrace/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw odds papertrade
          git commit -q -m "papertrade ${START} ${END}" || exit 0
          git push -q origin HEAD:boatrace-data
