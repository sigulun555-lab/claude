# boatrace/odds_range.txt ("開始日 終了日 券種") を書き換えてプッシュすると、
# その期間のレースの締切時オッズを公式サイトから1件ずつ(2秒間隔)取得し、
# boatrace-data ブランチの odds/ にCSVで保存する。途中で止まっても再実行で続きから取る。
name: boatrace-odds

on:
  push:
    branches: [boatrace-app]
    paths: [boatrace/odds_range.txt]

permissions:
  contents: write

concurrency: boatrace-data

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: boatrace-data を取得
        run: git clone -q --branch boatrace-data --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" boatrace/data
      - name: オッズ取得
        working-directory: boatrace
        timeout-minutes: 320
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          read START END BET < odds_range.txt
          python -m boatrace.cli --db /tmp/odds.sqlite load "$START" "$END" --offline > /dev/null
          python -m boatrace.cli --db /tmp/odds.sqlite fetch-odds "$START" "$END" --bet-type "$BET" \
            --csv "data/odds/${BET}_${START}_${END}.csv"
      - name: 保存
        if: always()
        working-directory: boatrace/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds
          git commit -q -m "odds $(cat ../odds_range.txt)" || exit 0
          git push -q origin HEAD:boatrace-data
